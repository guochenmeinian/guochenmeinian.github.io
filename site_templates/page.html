{% extends "base.html" %}

{% block content %}
{{ page.content | safe }}
{% endblock content %}

{% block footer %}
<p class="tagsData">
{% if page.taxonomies.tags %}
{% for tag in page.taxonomies.tags %}
<a href="/tags/{{ tag | slugify }}">&#47;{{ tag }}&#47;</a>
{% endfor %}
{% endif %}
</p>
{% endblock footer %}
