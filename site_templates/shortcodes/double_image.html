<style>
    .double-image-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .double-image-container img { box-sizing: border-box; width: 100%; max-width: 100%; margin: 0; max-height: 300px; object-fit: cover; }
    @media (min-width: 600px) {
        .double-image-container { flex-direction: row; }
        .double-image-container img { width: calc(50% - 5px); max-width: calc(50% - 5px); height: auto; }
    }
    .double-image-container.photo-pair img { box-sizing: border-box; width: 100%; max-width: 100%; height: 300px; max-height: none; margin: 0; object-fit: cover; }
    @media (min-width: 600px) {
        .double-image-container.photo-pair img { width: calc(50% - 5px); max-width: calc(50% - 5px); }
    }
    .double-image-container.landscape-pair img { height: auto; aspect-ratio: 3 / 2; }
</style>
<div class="double-image-container{% if equal_height %} photo-pair{% endif %}{% if landscape %} landscape-pair{% endif %}">
    <img src="{{ get_url(path1) }}" alt="{{ alt1 | default('Photo') }}" loading="lazy">
    <img src="{{ get_url(path2) }}" alt="{{ alt2 | default('Photo') }}" loading="lazy">
</div>
