<meta charset="utf-8">
<title>Redirect</title>
<script>
  const target = "/about/";
  const hash = window.location.hash || "";
  window.location.replace(target + hash);
</script>

  <meta http-equiv="refresh" content="0; url=/about/">
</noscript>
<p><a href="/about/">Click here</a> to be redirected.</p>
